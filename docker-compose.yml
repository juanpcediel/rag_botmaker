services:

  batch_indexer:
    build:
      context: ./batch_indexer
      dockerfile: Dockerfile
    container_name: batch_indexer
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./artifacts/faiss:/artifacts/faiss
    environment:
      - FAISS_LOCAL_DIR=/artifacts/faiss  
    restart: unless-stopped


  rag_api:
    build:
      context: ./rag_api
      dockerfile: Dockerfile
    container_name: rag_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./artifacts/faiss:/artifacts/faiss
    environment:
      - FAISS_LOCAL_DIR=/artifacts/faiss
    depends_on:
      - batch_indexer
    restart: unless-stopped